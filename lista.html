<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="lista.css">
    <title>Lista de pessoas</title>
</head>
<body>
    <main>
        <div class="lista">
            <button type="button" class="voltar">&#8592;</button>
            <h1>Lista de Pessoas</h1>
            <div class="filtro">
                <input type="search" name="filtro" id="filtro" placeholder="Pesquisar">
            </div>
            <div class="tabela">
                <table>
                    <thead>
                        <tr>
                            <th>Nome</th>
                            <th>Data de Nascimento</th>
                            <th>CPF</th>
                            <th>Celular/ Whatsapp</th>
                            <th>Cidade onde mora</th>
                            <th>Parcelas</th>
                            <th>Observações</th>
                            <th>Status</th>
                            <th>Ações</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr>
                            <td>Emanuele Rodrigues Ferreira</td>
                            <td>07/06/2006</td>
                            <td>150.437.366-90</td>
                            <td>(38) 99999-4161</td>
                            <td>Montes Claros</td>
                            <td>10x R$185,00</td>
                            <td>Não há observações.</td>
                            <td><span class="status">PENDENTE</span></td>
                            <td><span class="editar" title="Editar">✏️</span>
                            <span class="excluir" title="Excluir">🗑️</span></td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </main>
</body>
</html>
